# Configuracion del sistema de analisis de afilado.
# Las claves son exactamente los nombres de los campos de las dataclasses de
# src/afilado/config.py. Una clave mal escrita NO se ignora: la carga falla con
# un error que la nombra, para que un typo no pase por un cambio de umbral.

camara:
  # De donde sale la imagen:
  #   auto        busca la camara sola: recorre los indices y los backends hasta encontrar
  #               una que ENTREGUE imagen. Es lo recomendado, y lo unico que funciona sin
  #               tocar nada cuando la camara no queda en el indice 0.
  #   0, 1, 2...  fija un indice concreto. Si ese indice falla el programa NO cambia de
  #               camara solo (podria ser otra), pero si prueba los otros backends y, si
  #               encuentra camaras, te dice en el error cual es el indice bueno.
  #   una ruta    reproduce un video grabado, para probar sin camara.
  #
  # Para ver que hay conectado:  python -m afilado.cli.run_live --listar-camaras
  fuente: auto
  # RESOLUCION DE CAPTURA. Es el costo que se paga en TODOS los frames, se clasifique o no:
  # decodificar el MJPG que manda la webcam, preparar la entrada de la red y dibujar el
  # overlay. Medido en un i5-12400 (ms por frame, sumando los tres pasos):
  #
  #     1280x720 -> 6.45 ms      800x600 -> 4.04 ms      640x480 -> 3.07 ms
  #
  # A 30 fps eso es 19.4% de un nucleo contra 9.2%. En esta maquina no se nota; en una PC
  # tres o cuatro veces mas lenta es la diferencia entre ir comodo y ir justo.
  #
  # QUE SE PIERDE AL BAJARLA (leer antes de tocar):
  #  - Las fotos que archiva el operario con 'a'/'r' quedan a ESTA resolucion, y son el
  #    dataset de todos los entrenamientos futuros. Para clasificar alcanza de sobra
  #    (la red mira 224 px igual), pero es una decision que despues no se puede deshacer.
  #  - El operario ve la sierra mas chica en pantalla para decidir aprobada/rechazada.
  #  - Para tarea "detect"/"segment" con medicion por ArUco hay que VOLVER a 1280x720:
  #    ahi los pixeles sobre el marcador son directamente la precision en milimetros.
  # 640x480 es lo UNICO que entrega el microscopio USB del taller: pedirle 800x600 o mas
  # devuelve 640x480 igual (verificado reabriendo la camara para cada resolucion). HiView
  # muestra 800x600 porque lo escala el, no porque la camara lo de.
  ancho: 640
  alto: 480
  fps: 30
  # Como habla OpenCV con la camara. "auto" prueba, EN ORDEN, DSHOW, MSMF y CAP_ANY en
  # Windows (V4L2 y CAP_ANY en el resto) y se queda con el primero que entregue imagen.
  # Probar uno solo era la causa mas comun de "no se pudo abrir la camara": hay camaras
  # --y sesiones de Escritorio Remoto-- donde DSHOW no abre nada y MSMF anda perfecto.
  # Nombrar un backend a mano ("dshow", "msmf", "v4l2") desactiva la prueba: se usa ese.
  backend: auto
  # El autofoco es el enemigo de la escala: si el lente reenfoca, el tamano aparente
  # del marcador cambia y todas las medidas en mm se corren. Dejar en false.
  autofocus: false
  # Valor fijo de enfoque (0..255 segun camara). null = no tocar el enfoque.
  enfoque: null
  # Exposicion manual. null = automatica. Con metal pulido conviene fijarla.
  # OJO: el microscopio del taller NO expone este control (devuelve -1). Para corregir una
  # imagen oscura, los que si funcionan son brillo y ganancia, aca abajo.
  exposicion: null
  # Brillo y ganancia del SENSOR. null = no tocar.
  #
  # El microscopio USB entrega una imagen casi negra con los valores de fabrica, aun con su
  # anillo de LEDs prendido. Medido sobre un diente real:
  #
  # LA GANANCIA ES LA QUE DA DETALLE; el brillo solo corre el nivel. Barrido completo
  # sobre un diente real con la luz del microscopio prendida (nitidez = varianza Laplace):
  #
  #     brillo  gan | medio  quemado  nitidez
  #          0    0 |  16.1     0.0%       10    inservible, 44% en negro puro
  #          0   64 |  81.1     0.0%       95    bien
  #         16   64 | 109.2     0.6%       95    EL MEJOR
  #         32   64 | 136.2     5.7%       89    empieza a quemar
  #         64   64 | 182.6    24.4%       61    un cuarto quemado, se pierde el filo
  #         64   32 | 121.7     0.0%       43    bien expuesta pero sin detalle
  #
  # Quemar es tan malo como oscurecer: a partir del 5% de pixeles en 255 la nitidez CAE,
  # porque el detalle del filo se funde en blanco. Por eso no se busca la imagen mas
  # brillante sino la que mas detalle conserva.
  #
  # Los dos topean en 64 en esta camara: pedirle mas devuelve 64 y el programa lo avisa.
  # Se tocan en el SENSOR, no despues: asi la foto que se archiva para reentrenar ya sale
  # bien expuesta. Estirarla por software solo amplificaria el ruido de una imagen que
  # nunca tuvo la informacion.
  #
  # OJO: estos valores dependen de la intensidad de la lampara del microscopio. Si se
  # cambia la luz, hay que rehacer el barrido.
  #
  # Con una webcam comun y luz de taller, dejar los dos en null.
  brillo: 16
  ganancia: 64
  voltear_horizontal: false

aruco:
  habilitado: true
  diccionario: DICT_4X4_50
  # LADO FISICO REAL del marcador impreso, en milimetros, verificado con calibre.
  # Este numero es el patron que convierte pixeles a milimetros: si el marcador se
  # imprimio con "ajustar a pagina" y mide 28.4 mm en vez de 30, TODAS las medidas
  # saldran mal en el mismo porcentaje. Medir el impreso, no confiar en el PDF.
  lado_mm: 30.0
  # Id del marcador que se usa como referencia. null = usar el de menor id visible.
  id_referencia: 0
  # Coeficiente EMA sobre px_por_mm (0..1). Bajo = mas estable pero mas lento en reaccionar.
  suavizado: 0.3
  # Frames que se sigue extrapolando la ultima escala cuando el marcador queda tapado
  # (una mano, la pieza). Pasado el limite, las medidas dejan de ser fiables.
  max_frames_sin_marcador: 90
  # Desvio relativo tolerado entre los 4 lados del marcador. Por encima, la camara no
  # esta a 90 grados y el overlay avisa "CAMARA INCLINADA".
  max_error_lados: 0.06

roi:
  # Region de interes en coordenadas NORMALIZADAS 0..1 respecto del frame, para que el
  # recorte no dependa de la resolucion de la camara. Recorta la zona util de la mesa e
  # ignora lo que pasa alrededor (manos, herramientas apoyadas, fondo).
  # Solo se filtran las detecciones cuyo CENTRO cae dentro; el ArUco se busca igual en
  # el frame completo, asi que el marcador puede estar fuera del ROI.
  # Restriccion: x + w <= 1 y y + h <= 1.
  habilitado: true
  x: 0.15
  y: 0.15
  w: 0.7
  h: 0.7

# Como se ve el programa en pantalla.
interfaz:
  # "simple"   LA DEL TALLER. Dos recuadros --la sierra y el modelo aprobado-- y abajo
  #            un cartel RESULTADO enorme que dice APROBADO en verde o DESAPROBADO en rojo.
  #            Sin porcentajes por clase ni jerga: se lee de un vistazo y desde lejos.
  # "revision" lo mismo pero con la banda de veredicto arriba y el detalle por clase.
  # "clasico"  sin pantalla partida: la banda sobre la imagen en vivo, juzgando todos los
  #            frames. Es el modo de la webcam cenital, anterior al microscopio.
  modo: simple
  # CARPETA con las fotos de pieza aprobada, una por modelo de sierra. Se muestra al lado
  # para que el operario compare a ojo.
  #
  # Cada modelo tiene su geometria de diente, asi que comparar un LU3F-0300 contra la foto
  # de un R01 no dice nada. Por eso es una carpeta y no un archivo: se tienen todas las que
  # hagan falta y se cambia entre ellas con la tecla 'm' o el boton OTRO MODELO.
  #
  #   - el NOMBRE del archivo es el que se muestra en pantalla. Conviene ponerle el modelo
  #     de sierra: LU3F-0300.jpg, R01.jpg...
  #   - el ORDEN en que se ciclan es el alfabetico, asi que numerarlas (01-..., 02-...)
  #     alcanza para fijarlo.
  #   - la tecla 'f' AGREGA una foto nueva (no pisa las anteriores) con la fecha y hora
  #     como nombre; despues se la renombra con el modelo que corresponda.
  #   - se recuerda cual estaba elegida la ultima vez, en un archivo .ultima adentro de la
  #     carpeta. Si se borra, vuelve a arrancar por la primera.
  #
  # Tambien se acepta la ruta de UN archivo, que es lo que tenian los configs anteriores:
  # en ese caso se usa su carpeta como galeria y ese archivo queda preseleccionado.
  referencia_aprobada: data/referencia/microscopio
  # A partir de que coincidencia se da por APROBADO. 0.70 = 70%.
  #
  # QUE MIDE ESTE NUMERO: cuanta probabilidad le da el modelo a que la pieza sea de las
  # APROBADAS. O sea, cuanto se parece a las piezas buenas con las que se lo entreno.
  #
  # QUE NO MIDE: NO es una comparacion pixel a pixel contra la foto de referencia. Eso
  # estaria dominado por la luz y el encuadre, no por el estado del filo: dos fotos del
  # mismo diente con distinta iluminacion dan muy distinto, y dos dientes distintos con la
  # misma luz dan casi igual. Daria un porcentaje con cara de dato que no significa nada.
  # La foto de referencia esta para que la compare el OJO del operario, no el programa.
  #
  # 0.70 es un punto de partida. Si pasan piezas que no deberian, subirlo; si frena piezas
  # buenas, bajarlo. Conviene ajustarlo recien cuando haya un modelo entrenado con fotos
  # del microscopio y se vea como se porta.
  umbral_aprobacion: 0.70

detector:
  # Ruta al modelo entrenado. LA EXTENSION DECIDE COMO SE CORRE:
  #
  #   .pt    checkpoint de ultralytics. Necesita torch (533 MB) + ultralytics. Es lo que
  #          sale de 'train', y lo natural en la PC de entrenamiento.
  #   .onnx  el mismo modelo exportado con scripts/exportar_onnx.py. Corre con opencv, que
  #          este proyecto ya necesita por el modulo aruco: NO hace falta torch. Da el mismo
  #          veredicto (verificado sobre 34 fotos del taller, diferencia media 0.0011) y usa
  #          80 MB de RAM en vez de 440 MB, con un entorno de ~250 MB en vez de 1.2 GB.
  #          Es lo que conviene en la PC del taller. El .onnx viaja SIEMPRE con su archivo
  #          .onnx.json al lado: ahi estan las clases y el tamano de entrada reales.
  #
  # Si el archivo no existe: en clasificacion se entra en modo recoleccion (juntar fotos con
  # las teclas), y en deteccion se usa el respaldo geometrico (Otsu + contornos), que permite
  # medir y recolectar datos desde el dia 1.
  pesos: models/afilado_best.pt
  # "classify" (veredicto de la sierra entera: aprobada/rechazada), "detect" (cajas) o
  # "segment" (mascaras + medidas). El sistema esta en modo clasificacion: run_live muestra
  # el veredicto y, sin modelo aun, entra en modo recoleccion (juntar fotos por clase).
  tarea: classify
  # Umbral alto a proposito: el aserrin, las manchas de aceite y los reflejos del metal
  # pulido generan detecciones espurias de confianza media. Preferimos perder una
  # deteccion dudosa antes que reportar un defecto inexistente.
  confianza: 0.80
  iou: 0.45
  # Lado en px al que se reescala la imagen antes de entrar a la red. TIENE QUE COINCIDIR con
  # el imgsz con el que se entreno el modelo: entrenar a 224 e inferir a 640 (o al reves) no
  # da ningun error, degrada el veredicto en silencio, que es la peor forma de fallar.
  # 224 es el tamano nativo de los modelos de clasificacion: yolo11n-cls se entrena a 224, y
  # correrlo a 640 son ocho veces mas cuentas a cambio de nada.
  # Medido en un i5-12400 sin GPU: en vivo, 640 tarda 35 ms por frame y 224 tarda 12 ms;
  # entrenando, 640 rinde 4.4 img/s y 224 rinde 17.1 img/s.
  # Para tarea "detect"/"segment" hay que volver a 640: ahi el tamano SI manda, porque un
  # diente de 2 mm reducido a 224 px queda en un punado de pixeles.
  imgsz: 224
  # Cada cuantos frames se vuelve a preguntar el veredicto a la red. 1 = en todos (lo mas caro).
  # Una sierra apoyada en la mesa no cambia de estado 30 veces por segundo, y la red es lo unico
  # caro del bucle. Con 5, a 30 fps, el veredicto en pantalla tiene a lo sumo 167 ms de atraso
  # --imperceptible para el operario-- y el costo de computo se divide por cinco. Es la palanca
  # mas grande para que el sistema ande en una PC sin GPU.
  # Bajarlo a 1 o 2 si la camara mira piezas EN MOVIMIENTO (una cinta, una carga continua):
  # ahi el atraso si se nota. Subirlo mas solo tiene sentido con la pieza quieta.
  # Solo aplica a tarea "classify".
  clasificar_cada_n_frames: 5
  # "auto" = cuda:0 si hay GPU disponible, si no cpu.
  dispositivo: auto
  max_detecciones: 20

filtros:
  # Area minima en mm2 para aceptar una deteccion como pieza real. Un diente de widia
  # ronda decenas de mm2; por debajo de este valor es polvo, viruta o ruido.
  # Solo se aplica si hay escala valida del ArUco; sin escala se cae al filtro en px.
  area_minima_mm2: 20.0
  # Techo de area: descarta la mesa entera o una sombra grande tomada como objeto.
  area_maxima_mm2: 100000.0
  # Filtro de respaldo en pixeles, siempre activo (funciona aunque no se vea el marcador).
  area_minima_px: 400
  # Lado del kernel de la apertura morfologica. Debe ser IMPAR (necesita pixel central).
  kernel_morfologico: 3
  iteraciones_morfologicas: 1

feedback:
  habilitado: true
  # Carpeta raiz del bucle de auto-entrenamiento. Se organiza por fecha, y guarda la
  # imagen LIMPIA (sin overlay), el pre-etiquetado YOLO y el informe de lo que penso la IA.
  directorio: data/feedback
  guardar_json: true
  # Copia con las cajas dibujadas, para revision humana. Va a revision/, nunca junto a
  # la imagen limpia: el dataset debe contener solo pixeles reales de la pieza.
  guardar_anotada: true
  calidad_jpg: 95

# Clases del modelo, en el mismo orden que el data.yaml del entrenamiento.
# Esquema BINARIO (primera prueba): la sierra completa se juzga aprobada o rechazada.
# Cuando haya mas datos se puede refinar a defectos especificos (diente_faltante, fisura,
# oxido, desgastado, astillado) sin romper nada: basta agregar clases al final.
clases:
  - aprobada
  - rechazada

# Subconjunto de clases que el overlay pinta en rojo.
clases_defecto:
  - rechazada
